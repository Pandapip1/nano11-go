insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod udf
insmod map
insmod chain
insmod all_video
insmod echo
insmod test
insmod sleep
insmod search
insmod search_fs_file

set instmedia=
search --no-floppy --file --set=instmedia /sources/boot.wim

set osdev=
set ospath=
for efipath in \
    /EFI/Microsoft/Boot/bootmgfw.efi \
    /EFI/systemd/systemd-bootx64.efi \
    /EFI/ubuntu/shimx64.efi \
    /EFI/ubuntu/grubx64.efi \
    /EFI/debian/grubx64.efi \
    /EFI/fedora/shimx64.efi \
    /EFI/fedora/grubx64.efi \
    /EFI/rEFInd/refind_x64.efi ; do
    if [ -z "${osdev}" ]; then
        set hit=
        search --no-floppy --file --set=hit "${efipath}"
        if [ -n "${hit}" ]; then
            if [ "${hit}" != "${instmedia}" ]; then
                set osdev="${hit}"; set ospath="${efipath}"
            fi
        fi
    fi
done

set timeout=5
set timeout_style=menu
set default=0

if [ -n "${osdev}" ]; then
    menuentry "Boot installed OS  (${osdev})${ospath}  [autoprobed]" {
        set root="${osdev}"; chainloader "${ospath}"; boot
    }
fi
menuentry "Windows Setup  --  nano11-go installation image (wimboot)" {
    set root="${instmedia}"
    echo "Booting WinPE via wimboot (a1ive)..."
    wimboot @:boot.wim:/sources/boot.wim
}
menuentry "Memory test (memtest.efi)" {
    set root="${instmedia}"
    chainloader /efi/microsoft/boot/memtest.efi
    boot
}
if [ "${grub_platform}" = "efi" ]; then
    menuentry "Reboot into firmware settings (UEFI)" { fwsetup }
fi
menuentry "GRUB command shell (diagnostics)" {
    echo "instmedia=${instmedia}  osdev=${osdev}"; sleep 10
}
